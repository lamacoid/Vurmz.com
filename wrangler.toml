# VURMZ Website - Cloudflare Pages Configuration
name = "vurmz-website"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Pages configuration - next-on-pages output
pages_build_output_dir = ".vercel/output/static"

# KV namespace for rate limiting
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "02f167c6131342b4ad6a83ff6d45c768"

# Environment variables
[vars]
SITE_URL = "https://vurmz.com"

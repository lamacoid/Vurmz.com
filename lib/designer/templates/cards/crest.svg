<svg xmlns="http://www.w3.org/2000/svg" width="85.725mm" height="53.975mm" viewBox="0 0 85.725 53.975">
<title>Crest</title>
<desc>A centered identity, with a logo slot or initials above the company. One-tone engraving. Content inside 5.08 mm safe margin.</desc>
<rect id="safe" x="5.08" y="5.08" width="75.565" height="43.815" fill="none" stroke="none"/>
<g data-zone="identity"><rect data-slot="emblem" x="36.8625" y="5.3" width="12" height="12" fill="none" data-fit="contain"/><text data-slot="monogram" x="42.8625" y="15.4" font-family="Inter" font-size="10" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#000">AR</text><text data-slot="company" font-variant="small-caps" x="42.8625" y="24" font-family="Inter" font-size="3" font-weight="400" text-anchor="middle" letter-spacing="0.2" fill="#000">Rivera Plumbing</text><line x1="28" y1="27" x2="57.725" y2="27" stroke="#000" stroke-width="0.15"/></g><g data-zone="person"><text data-slot="name" x="42.8625" y="35" font-family="Fraunces" font-size="4.23" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#000">Alex Rivera</text><text data-slot="title" x="42.8625" y="40" font-family="Inter" font-size="2.12" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#000">Owner</text></g><g data-zone="contact"><text data-slot="contact-1" x="42.8625" y="47" font-family="Inter" font-size="2.12" font-weight="400" text-anchor="middle" letter-spacing="0" fill="#000">(720) 555-0139</text></g>

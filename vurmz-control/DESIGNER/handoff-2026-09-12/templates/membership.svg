<svg xmlns="http://www.w3.org/2000/svg" width="85.725mm" height="53.975mm" viewBox="0 0 85.725 53.975">
<title>Membership</title>
<desc>A member name, membership number and renewal date. One-tone engraving. Content inside 5.08 mm safe margin.</desc>
<rect id="safe" x="5.08" y="5.08" width="75.565" height="43.815" fill="none" stroke="none"/>
<g data-zone="identity"><text data-slot="company" x="5.08" y="10" font-family="Inter" font-size="2.5" font-weight="400" text-anchor="start" letter-spacing="0" fill="#000">Rivera Plumbing</text><text data-slot="tagline" x="5.08" y="21" font-family="Inter" font-size="8" font-weight="400" text-anchor="start" letter-spacing="0" fill="#000">Member</text></g><g data-zone="member"><text data-slot="name" x="5.08" y="32" font-family="Inter" font-size="3.88" font-weight="400" text-anchor="start" letter-spacing="0" fill="#000">Alex Rivera</text><text data-slot="value" x="5.08" y="38" font-family="Inter" font-size="2.12" font-weight="400" text-anchor="start" letter-spacing="0" fill="#000">Member 0042</text></g><g data-zone="date"><line x1="5.08" y1="42" x2="80.645" y2="42" stroke="#000" stroke-width="0.15"/><text data-slot="date" x="5.08" y="47" font-family="Inter" font-size="2.12" font-weight="400" text-anchor="start" letter-spacing="0" fill="#000">Valid through 12 / 2027</text></g>
</svg>
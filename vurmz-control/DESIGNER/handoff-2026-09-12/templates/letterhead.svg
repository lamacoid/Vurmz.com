<svg xmlns="http://www.w3.org/2000/svg" width="85.725mm" height="53.975mm" viewBox="0 0 85.725 53.975">
<title>Letterhead</title>
<desc>A left-aligned company heading, personal details and a quiet contact footer. One-tone engraving. Content inside 5.08 mm safe margin.</desc>
<rect id="safe" x="5.08" y="5.08" width="75.565" height="43.815" fill="none" stroke="none"/>
<g data-zone="company"><text data-slot="company" font-variant="small-caps" x="5.08" y="12" font-family="Inter" font-size="6.4" font-weight="400" text-anchor="start" letter-spacing="0" fill="#000">Rivera Plumbing</text><line x1="5.08" y1="16" x2="80.645" y2="16" stroke="#000" stroke-width="0.15"/></g><g data-zone="person"><text data-slot="name" x="5.08" y="29" font-family="Fraunces" font-size="4.23" font-weight="400" text-anchor="start" letter-spacing="0" fill="#000">Alex Rivera</text><text data-slot="title" x="5.08" y="35" font-family="Inter" font-size="2.12" font-weight="400" text-anchor="start" letter-spacing="0" fill="#000">Owner</text></g><g data-zone="contacts"><text data-slot="contact-1" x="5.08" y="43" font-family="Inter" font-size="2.12" font-weight="400" text-anchor="start" letter-spacing="0" fill="#000">(720) 555-0139</text><text data-slot="contact-2" x="5.08" y="48" font-family="Inter" font-size="2.12" font-weight="400" text-anchor="start" letter-spacing="0" fill="#000">alex@riveraplumbing.com</text></g>
</svg>
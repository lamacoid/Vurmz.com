<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <!-- Main background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2F2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b1a;stop-opacity:1" />
    </linearGradient>

    <!-- Bronze/brass gradient -->
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#CD9B6F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B8845A;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#A0713F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5A2B;stop-opacity:1" />
    </linearGradient>

    <!-- Radial light effect for bronze -->
    <radialGradient id="bronzeShine" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#F0E6D2;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#8B5A2B;stop-opacity:0" />
    </radialGradient>

    <!-- Bronze texture pattern -->
    <pattern id="bronzeTexture" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#bronzeGrad)"/>
      <circle cx="20" cy="25" r="1.5" fill="#C0A070" opacity="0.4"/>
      <circle cx="60" cy="45" r="1" fill="#C0A070" opacity="0.3"/>
      <circle cx="80" cy="70" r="1.2" fill="#C0A070" opacity="0.35"/>
      <circle cx="40" cy="80" r="0.8" fill="#F0E6D2" opacity="0.2"/>
      <line x1="0" y1="35" x2="100" y2="35" stroke="#9B6A3B" stroke-width="0.5" opacity="0.15"/>
    </pattern>

    <!-- Teal glow filter -->
    <filter id="tealglow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Deep shadow -->
    <filter id="deepshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="10" dy="10" stdDeviation="6" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Ambient light -->
  <rect x="150" y="100" width="500" height="400" fill="#3CB9B2" opacity="0.05" rx="24"/>

  <!-- Plaque shadow -->
  <rect x="218" y="138" width="364" height="424" fill="#000000" opacity="0.5" rx="16" transform="translate(10, 10)"/>

  <!-- Main plaque body -->
  <rect x="218" y="138" width="364" height="424" fill="url(#bronzeTexture)" stroke="#5A3A1F" stroke-width="4" rx="16" filter="url(#deepshadow)"/>

  <!-- Bronze shine layer -->
  <rect x="218" y="138" width="364" height="424" fill="url(#bronzeShine)" rx="16"/>

  <!-- Inner detail border -->
  <rect x="235" y="155" width="330" height="390" fill="none" stroke="#9B6A3B" stroke-width="1.5" opacity="0.6" rx="12"/>

  <!-- Top section - "IN LOVING MEMORY OF" -->
  <g filter="url(#tealglow)">
    <text x="400" y="210" font-family="Georgia, serif" font-size="20" font-style="italic" text-anchor="middle" fill="#FFF8DC">IN LOVING MEMORY OF</text>
  </g>

  <!-- Subtle glow on top text -->
  <g opacity="0.25">
    <text x="400" y="210" font-family="Georgia, serif" font-size="20" font-style="italic" text-anchor="middle" fill="#3CB9B2">IN LOVING MEMORY OF</text>
  </g>

  <!-- Main name - large and prominent -->
  <g filter="url(#tealglow)">
    <text x="400" y="285" font-family="Georgia, serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#FFF8DC">ROBERT JAMES</text>
    <text x="400" y="340" font-family="Georgia, serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#FFF8DC">THOMPSON</text>
  </g>

  <!-- Glow effect on main name -->
  <g opacity="0.35">
    <text x="400" y="285" font-family="Georgia, serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#3CB9B2">ROBERT JAMES</text>
    <text x="400" y="340" font-family="Georgia, serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#3CB9B2">THOMPSON</text>
  </g>

  <!-- Decorative separator line -->
  <line x1="280" y1="360" x2="520" y2="360" stroke="#C0A070" stroke-width="1.5" opacity="0.5"/>

  <!-- Dates -->
  <g filter="url(#tealglow)">
    <text x="400" y="400" font-family="Georgia, serif" font-size="26" font-weight="600" text-anchor="middle" fill="#FFF8DC">1945 – 2024</text>
  </g>

  <!-- Glow on dates -->
  <g opacity="0.28">
    <text x="400" y="400" font-family="Georgia, serif" font-size="26" font-weight="600" text-anchor="middle" fill="#3CB9B2">1945 – 2024</text>
  </g>

  <!-- Bottom inscription -->
  <g filter="url(#tealglow)">
    <text x="400" y="450" font-family="Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" fill="#FFF8DC">FOREVER IN OUR HEARTS</text>
  </g>

  <!-- Glow on inscription -->
  <g opacity="0.25">
    <text x="400" y="450" font-family="Georgia, serif" font-size="22" font-style="italic" text-anchor="middle" fill="#3CB9B2">FOREVER IN OUR HEARTS</text>
  </g>

  <!-- Bottom decorative corner accents -->
  <circle cx="245" cy="530" r="3" fill="#C0A070" opacity="0.6"/>
  <circle cx="555" cy="530" r="3" fill="#C0A070" opacity="0.6"/>

  <!-- Aged patina highlights -->
  <ellipse cx="300" cy="250" rx="40" ry="60" fill="#3CB9B2" opacity="0.08"/>
  <ellipse cx="500" cy="350" rx="50" ry="70" fill="#3CB9B2" opacity="0.06"/>
</svg>
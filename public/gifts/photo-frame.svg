<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2F2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b1a;stop-opacity:1" />
    </linearGradient>

    <!-- Frame Wood Gradient -->
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B7040;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B6035;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7A5830;stop-opacity:1" />
    </linearGradient>

    <!-- Inner Mat Gradient (darker) -->
    <linearGradient id="matGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6A4820;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A3810;stop-opacity:1" />
    </linearGradient>

    <!-- Teal Glow Filter -->
    <filter id="tealglow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow Light Filter -->
    <filter id="glowlight">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>

  <!-- Shadow -->
  <ellipse cx="400" cy="520" rx="180" ry="40" fill="rgba(0,0,0,0.3)"/>

  <!-- Picture Frame -->
  <g id="frame">
    <!-- Outer Frame with Molding Profile -->
    <rect x="150" y="100" width="500" height="380" rx="8" fill="url(#frameGradient)" stroke="rgba(0,0,0,0.5)" stroke-width="2"/>

    <!-- Frame Edge Highlight (molding left) -->
    <line x1="155" y1="110" x2="155" y2="470" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>

    <!-- Frame Edge Highlight (molding top) -->
    <line x1="155" y1="110" x2="645" y2="110" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

    <!-- Frame Edge Shadow (molding right) -->
    <line x1="645" y1="110" x2="645" y2="470" stroke="rgba(0,0,0,0.3)" stroke-width="2"/>

    <!-- Frame Edge Shadow (molding bottom) -->
    <line x1="155" y1="470" x2="645" y2="470" stroke="rgba(0,0,0,0.4)" stroke-width="2"/>

    <!-- Inner Frame Border -->
    <rect x="165" y="120" width="470" height="340" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>

    <!-- Mat Area (darker inner border) -->
    <rect x="175" y="135" width="450" height="310" rx="4" fill="url(#matGradient)" stroke="rgba(0,0,0,0.4)" stroke-width="1.5"/>

    <!-- Glass Reflection -->
    <rect x="175" y="135" width="450" height="310" rx="4" fill="rgba(255,255,255,0.05)"/>

    <!-- Wood Grain Pattern on Frame -->
    <line x1="160" y1="150" x2="640" y2="155" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <line x1="160" y1="250" x2="640" y2="250" stroke="rgba(0,0,0,0.06)" stroke-width="0.8"/>
    <line x1="160" y1="350" x2="640" y2="345" stroke="rgba(0,0,0,0.07)" stroke-width="1"/>
    <line x1="160" y1="450" x2="640" y2="455" stroke="rgba(255,255,255,0.06)" stroke-width="0.8"/>

    <!-- Vertical wood grain -->
    <line x1="200" y1="120" x2="202" y2="460" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
    <line x1="350" y1="120" x2="348" y2="460" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <line x1="500" y1="120" x2="502" y2="460" stroke="rgba(0,0,0,0.05)" stroke-width="1"/>
    <line x1="600" y1="120" x2="598" y2="460" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  </g>

  <!-- Teal Glow Text in Center -->
  <g id="frame-text">
    <!-- Main Text -->
    <text x="400" y="280" font-family="Georgia, serif" font-size="48" text-anchor="middle" fill="#3CB9B2" filter="url(#tealglow)" opacity="0.9">
      Your Photo
    </text>

    <!-- Glow effect layer -->
    <text x="400" y="280" font-family="Georgia, serif" font-size="48" text-anchor="middle" fill="none" stroke="#3CB9B2" stroke-width="1.5" opacity="0.35" filter="url(#glowlight)">
      Your Photo
    </text>

    <!-- Decorative lines -->
    <line x1="250" y1="310" x2="550" y2="310" stroke="#3CB9B2" stroke-width="1" opacity="0.4"/>
    <line x1="250" y1="320" x2="550" y2="320" stroke="#3CB9B2" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Frame Highlights -->
  <ellipse cx="220" cy="180" rx="60" ry="80" fill="rgba(255,255,255,0.08)"/>
  <ellipse cx="600" cy="400" rx="50" ry="60" fill="rgba(255,255,255,0.05)"/>
</svg>
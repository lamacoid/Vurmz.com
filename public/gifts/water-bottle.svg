<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2F2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b1a;stop-opacity:1" />
    </linearGradient>

    <!-- Metallic bottle gradient -->
    <linearGradient id="bottleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4A5568;stop-opacity:1" />
      <stop offset="15%" style="stop-color:#E8EAED;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9CA3AF;stop-opacity:1" />
      <stop offset="85%" style="stop-color:#E8EAED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A5568;stop-opacity:1" />
    </linearGradient>

    <!-- Cap gradient -->
    <linearGradient id="capGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D3748;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A202C;stop-opacity:1" />
    </linearGradient>

    <!-- Teal text glow -->
    <filter id="tealglow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow filter -->
    <filter id="shadow">
      <feDropShadow dx="2" dy="12" stdDeviation="10" flood-opacity="0.5"/>
    </filter>

    <clipPath id="svgClip">
      <rect width="800" height="600" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- Clipped container -->
  <g clip-path="url(#svgClip)">
    <!-- Background -->
    <rect width="800" height="600" fill="url(#bgGradient)"/>

    <!-- Subtle base reflection -->
    <ellipse cx="400" cy="520" rx="180" ry="35" fill="rgba(60, 185, 178, 0.06)"/>

    <!-- Water bottle group -->
    <g transform="translate(400, 300)" filter="url(#shadow)">
      <!-- Bottle cap (top) -->
      <g transform="translate(0, -140)">
        <rect x="-22" y="-20" width="44" height="28" rx="4" fill="url(#capGradient)"/>
        <ellipse cx="0" cy="-20" rx="22" ry="8" fill="#3A4556"/>
        <ellipse cx="0" cy="-20" rx="18" ry="6" fill="rgba(255, 255, 255, 0.1)"/>
      </g>

      <!-- Main bottle body -->
      <path d="M -50 -120 Q -55 -40 -52 40 Q -50 80 -40 120 L 40 120 Q 50 80 52 40 Q 55 -40 50 -120 Q 40 -130 0 -135 Q -40 -130 -50 -120"
            fill="url(#bottleGradient)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>

      <!-- Bottle shine/highlight for glass effect -->
      <ellipse cx="-30" cy="-60" rx="12" ry="80" fill="rgba(255, 255, 255, 0.25)"/>
      <ellipse cx="32" cy="20" rx="8" ry="60" fill="rgba(255, 255, 255, 0.12)"/>

      <!-- Base/bottom of bottle -->
      <ellipse cx="0" cy="120" rx="40" ry="8" fill="rgba(0, 0, 0, 0.4)"/>

      <!-- Engraving area - main logo/text section -->
      <g transform="translate(0, -15)">
        <!-- Engraved background depression -->
        <ellipse cx="0" cy="0" rx="45" ry="38" fill="rgba(0, 0, 0, 0.25)"/>

        <!-- Paw print symbol -->
        <g transform="translate(0, -18)">
          <!-- Main paw pad -->
          <circle cx="0" cy="0" r="8" fill="#3CB9B2" opacity="0.85" filter="url(#tealglow)"/>
          <!-- Toe pads -->
          <circle cx="-18" cy="-8" r="5" fill="#3CB9B2" opacity="0.85" filter="url(#tealglow)"/>
          <circle cx="-10" cy="-15" r="5" fill="#3CB9B2" opacity="0.85" filter="url(#tealglow)"/>
          <circle cx="10" cy="-15" r="5" fill="#3CB9B2" opacity="0.85" filter="url(#tealglow)"/>
          <circle cx="18" cy="-8" r="5" fill="#3CB9B2" opacity="0.85" filter="url(#tealglow)"/>
        </g>

        <!-- Team name text -->
        <text x="0" y="22" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
              text-anchor="middle" fill="#3CB9B2" opacity="0.9" filter="url(#tealglow)" letter-spacing="1">
          WILDCATS
        </text>
      </g>
    </g>
  </g>
</svg>
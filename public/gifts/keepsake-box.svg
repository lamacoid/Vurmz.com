<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2F2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b1a;stop-opacity:1" />
    </linearGradient>

    <!-- Honey wood gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C99A5E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8824A;stop-opacity:1" />
    </linearGradient>

    <!-- Darker wood for sides -->
    <linearGradient id="darkWoodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A67C52;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6839;stop-opacity:1" />
    </linearGradient>

    <!-- Felt interior gradient (dark purple/navy) -->
    <linearGradient id="feltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a2f4d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a1f3d;stop-opacity:1" />
    </linearGradient>

    <!-- Teal glow for engraving -->
    <filter id="teaGlow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow filter -->
    <filter id="shadowFilter">
      <feDropShadow dx="4" dy="12" stdDeviation="10" flood-opacity="0.4"/>
    </filter>

    <!-- Wood shine -->
    <linearGradient id="woodShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Shadow beneath box -->
  <ellipse cx="420" cy="520" rx="180" ry="40" fill="rgba(0,0,0,0.35)"/>

  <!-- Keepsake box in 3/4 perspective (rotated) -->
  <g transform="translate(380, 320) rotate(-8)" filter="url(#shadowFilter)">

    <!-- Back/left side of box (darker wood) -->
    <polygon points="0,0 0,80 -60,110 -60,30" fill="url(#darkWoodGrad)" stroke="#4a3a2a" stroke-width="1.5"/>

    <!-- Front/right side of box (honey wood) -->
    <rect x="0" y="0" width="160" height="80" rx="6" fill="url(#woodGrad)" stroke="#5a4a3a" stroke-width="1.5"/>

    <!-- Bottom of box -->
    <polygon points="0,80 160,80 100,110 -60,110" fill="#9d7a52" stroke="#4a3a2a" stroke-width="1.5"/>

    <!-- Interior visible edge (felt lining) -->
    <polygon points="0,0 0,80 -60,110 -60,30" fill="url(#feltGrad)" opacity="0.9"/>

    <!-- Interior floor (visible through open lid) -->
    <polygon points="0,0 160,0 100,-30 -60,0" fill="url(#feltGrad)" opacity="0.85"/>

    <!-- Felt texture on visible interior -->
    <g opacity="0.15">
      <circle cx="-30" cy="50" r="15" fill="rgba(255,255,255,0.2)"/>
      <circle cx="-20" cy="30" r="20" fill="rgba(255,255,255,0.15)"/>
      <circle cx="-50" cy="70" r="12" fill="rgba(255,255,255,0.18)"/>
    </g>

    <!-- Box body wood grain texture -->
    <g opacity="0.12">
      <line x1="10" y1="0" x2="10" y2="80" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
      <line x1="40" y1="0" x2="40" y2="80" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <line x1="70" y1="0" x2="70" y2="80" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
      <line x1="100" y1="0" x2="100" y2="80" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
      <line x1="130" y1="0" x2="130" y2="80" stroke="rgba(0,0,0,0.25)" stroke-width="1"/>
    </g>

    <!-- Lid (hinged, slightly open) -->
    <g transform="translate(80, 0) rotate(-25)">
      <!-- Lid wood -->
      <rect x="-80" y="-50" width="160" height="50" rx="6" fill="url(#woodGrad)" stroke="#5a4a3a" stroke-width="1.5"/>

      <!-- Lid shine -->
      <rect x="-78" y="-48" width="156" height="12" rx="4" fill="url(#woodShine)" opacity="0.7"/>

      <!-- Lid wood grain -->
      <g opacity="0.12">
        <line x1="-70" y1="-50" x2="-70" y2="0" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
        <line x1="-40" y1="-50" x2="-40" y2="0" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        <line x1="-10" y1="-50" x2="-10" y2="0" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
        <line x1="20" y1="-50" x2="20" y2="0" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
        <line x1="50" y1="-50" x2="50" y2="0" stroke="rgba(0,0,0,0.25)" stroke-width="1"/>
      </g>

      <!-- Engraved text on lid: WITH LOVE -->
      <g filter="url(#teaGlow)">
        <text x="0" y="-22" font-family="Georgia, serif" font-size="26" font-weight="300" fill="none"
              stroke="#3CB9B2" stroke-width="0.75" text-anchor="middle" letter-spacing="3">
          WITH LOVE
        </text>
      </g>

      <!-- Heart flourish -->
      <g filter="url(#teaGlow)">
        <path d="M -15,-8 Q -20,-2 -15,2 Q -10,-2 -15,-8 M 15,-8 Q 10,-2 15,2 Q 20,-2 15,-8 M 0,8 L -15,-5 L 15,-5 Z"
              fill="none" stroke="#3CB9B2" stroke-width="1.2" opacity="0.9"/>
      </g>

      <!-- Subtle engraved text fill -->
      <g opacity="0.12">
        <text x="0" y="-22" font-family="Georgia, serif" font-size="26" font-weight="300" fill="#f5f5f5"
              text-anchor="middle" letter-spacing="3">WITH LOVE</text>
      </g>
    </g>

    <!-- Box shine/highlight on front -->
    <rect x="4" y="4" width="152" height="12" rx="4" fill="rgba(255,255,255,0.15)" opacity="0.6"/>

    <!-- Box shadow on front -->
    <rect x="0" y="72" width="160" height="8" rx="4" fill="rgba(0,0,0,0.12)" opacity="0.5"/>

  </g>
</svg>
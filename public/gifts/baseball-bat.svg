<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2F2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b1a;stop-opacity:1" />
    </linearGradient>

    <!-- Wood Gradient for Bat -->
    <linearGradient id="woodGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#C4883A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B0763D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5E25;stop-opacity:1" />
    </linearGradient>

    <!-- Glow Effect for Engraved Text -->
    <filter id="tealglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" />
    </filter>
    <filter id="tealglow-strong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.8" />
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)" />

  <!-- Baseball Bat - angled diagonally -->
  <g transform="translate(400, 300) rotate(-25)">
    <!-- Main bat body with wood grain -->
    <ellipse cx="0" cy="0" rx="45" ry="220" fill="url(#woodGradient)" />

    <!-- Wood grain lines -->
    <line x1="-35" y1="-200" x2="-35" y2="200" stroke="#704a20" stroke-width="1" opacity="0.4" />
    <line x1="-15" y1="-200" x2="-15" y2="200" stroke="#704a20" stroke-width="1" opacity="0.3" />
    <line x1="15" y1="-200" x2="15" y2="200" stroke="#704a20" stroke-width="1" opacity="0.3" />
    <line x1="35" y1="-200" x2="35" y2="200" stroke="#704a20" stroke-width="1" opacity="0.4" />

    <!-- Subtle horizontal grain patterns -->
    <ellipse cx="0" cy="-80" rx="45" ry="8" fill="#704a20" opacity="0.2" />
    <ellipse cx="0" cy="0" rx="45" ry="8" fill="#704a20" opacity="0.15" />
    <ellipse cx="0" cy="80" rx="45" ry="8" fill="#704a20" opacity="0.2" />

    <!-- Highlight on bat barrel -->
    <ellipse cx="-28" cy="0" rx="12" ry="180" fill="white" opacity="0.15" />

    <!-- Engraved Text "VURMZ" with teal glow -->
    <g filter="url(#tealglow-strong)">
      <text x="0" y="15" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#3CB9B2" text-anchor="middle" letter-spacing="4">VURMZ</text>
    </g>

    <!-- Knob at the end -->
    <circle cx="0" cy="235" r="18" fill="url(#woodGradient)" />
    <circle cx="-8" cy="235" r="6" fill="white" opacity="0.2" />
  </g>
</svg>